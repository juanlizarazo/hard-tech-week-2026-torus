<main class="flex min-h-screen items-center justify-center p-6">
  <mat-card class="hero-card flex w-full max-w-xl flex-col gap-4 p-10 max-sm:p-6" appearance="outlined">
    <div class="flex items-center gap-2 text-asphalt">
      <mat-icon class="text-congestion">bolt</mat-icon>
      <span class="font-bold tracking-[0.12em]">DETOUR</span>
    </div>

    <h1 class="m-0 text-4xl font-bold leading-tight text-asphalt max-sm:text-3xl">
      Rush hour for electrons.
    </h1>
    <p class="m-0 text-lg leading-relaxed text-gray-600">
      A day-ahead planner that routes a Torus Station around tomorrow's grid congestion.
    </p>

    @if (isConnected$ | async) {
      <div class="flex items-center gap-2 rounded-lg bg-clear-bg px-4 py-3 text-clear">
        <mat-icon>check_circle</mat-icon>
        <span>Connected to <code class="font-mono">{{ projectId }}</code></span>
      </div>
    } @else {
      <div class="flex items-center gap-2 rounded-lg bg-surface px-4 py-3 text-asphalt">
        <mat-icon>sync</mat-icon>
        <span>Connecting to <code class="font-mono">{{ projectId }}</code>…</span>
      </div>
    }
  </mat-card>
</main>
