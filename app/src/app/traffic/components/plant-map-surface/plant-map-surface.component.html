@if (useDeck) {
  <div class="surface" [class.surface--fill]="fill" [style.aspect-ratio]="fill ? null : width + ' / ' + data.height">
    <dt-grid-scene [data]="data" [hourView]="hourView" [paused]="paused" [drift]="fill" [home]="fill" (failed)="onFailed()"></dt-grid-scene>
  </div>
} @else {
  <dt-plant-map-svg class="surface__svg" [class.surface__svg--fill]="fill" [data]="data" [hourView]="hourView" [paused]="paused" [fill]="fill"></dt-plant-map-svg>
}
