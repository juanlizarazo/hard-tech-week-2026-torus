<div class="shell">
  <div class="shell__progress">
    @if (isLoading$ | async) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading"></mat-progress-bar>
    }
  </div>

  <header class="shell__header">
    <div class="shell__header-inner">
      <div class="shell__brand">
        <span class="shell__brand-name">DETOUR</span>
        <span class="shell__tagline">Day-ahead rush-hour planner for a simulated Torus Station</span>
      </div>
      <dt-snapshot-badge></dt-snapshot-badge>
    </div>
    <nav mat-tab-nav-bar class="shell__nav" [tabPanel]="tabPanel" aria-label="Primary">
      @for (link of links; track link.path) {
        <a mat-tab-link [routerLink]="link.path" routerLinkActive #active="routerLinkActive" [active]="active.isActive">
          {{ link.label }}
        </a>
      }
    </nav>
  </header>

  <mat-tab-nav-panel #tabPanel class="shell__content">
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-tab-nav-panel>

  <footer class="shell__footer">Simulated Torus Station — not a Torus product claim</footer>
</div>
