<figure class="dt-component-bars__figure">
  <figcaption class="dt-component-bars__top">
    <span class="dt-component-bars__title">Savings by bill component</span>
    @if (groups.length > 0) {
      <button type="button" class="dt-component-bars__toggle" [attr.aria-pressed]="showTable" (click)="toggleTable()">
        {{ showTable ? 'Show as chart' : 'Show as table' }}
      </button>
    }
  </figcaption>

  @if (groups.length === 0) {
    <p class="dt-component-bars__empty">No bill components to compare yet.</p>
  } @else {
    @if (strategyLegend.length > 0) {
      <ul class="dt-component-bars__legend">
        @for (item of strategyLegend; track item.id) {
          <li class="dt-component-bars__legend-item">
            <span class="dt-component-bars__swatch" [style.background]="'var(--dt-viz-' + item.colorIndex + ')'"></span>
            <span>{{ item.label }}</span>
          </li>
        }
      </ul>
    }

    @if (showTable) {
      <div class="dt-component-bars__table-wrap">
        <table class="dt-component-bars__table">
          <caption class="dt-component-bars__visually-hidden">Baseline bill and savings by component</caption>
          <thead>
            <tr>
              <th scope="col">Component</th>
              <th scope="col" class="dt-component-bars__num">Baseline</th>
              @for (item of strategyLegend; track item.id) {
                <th scope="col" class="dt-component-bars__num">{{ item.label }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (group of groups; track group.id) {
              <tr>
                <th scope="row">{{ group.label }}</th>
                <td class="dt-component-bars__num">{{ group.baselineAmount | currency: 'USD' : 'symbol' : '1.0-0' }}</td>
                @for (item of strategyLegend; track item.id) {
                  <td class="dt-component-bars__num">
                    @if (savingsFor(group, item.id) !== null) {
                      {{ savingsFor(group, item.id) | currency: 'USD' : 'symbol' : '1.0-0' }}
                    } @else {
                      -
                    }
                  </td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    } @else {
      <div class="dt-component-bars__groups" role="img" [attr.aria-label]="ariaSummary">
        @for (view of views; track view.group.id) {
          <div class="dt-component-bars__group">
            <div class="dt-component-bars__meta">
              <span class="dt-component-bars__label">{{ view.group.label }}</span>
              @if (view.group.source.url) {
                <a
                  class="dt-component-bars__chip"
                  [href]="view.group.source.url"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.title]="view.group.source.note ?? null"
                  >{{ view.group.source.kind }} · {{ view.group.source.label }}</a
                >
              } @else {
                <span class="dt-component-bars__chip" [attr.title]="view.group.source.note ?? null"
                  >{{ view.group.source.kind }} · {{ view.group.source.label }}</span
                >
              }
            </div>
            <div class="dt-component-bars__plot" [ngClass]="{ 'dt-component-bars__plot--signed': hasNegative }">
              <div class="dt-component-bars__axis">
                @if (hasNegative) {
                  <span class="dt-component-bars__zero" [style.left.%]="zeroPercent"></span>
                }
                @for (row of view.rows; track row.bar.strategyId) {
                  <div class="dt-component-bars__row">
                    <span
                      class="dt-component-bars__bar"
                      [style.left.%]="row.startPercent"
                      [style.width.%]="row.lengthPercent"
                      [style.background]="'var(--dt-viz-' + row.bar.colorIndex + ')'"
                    ></span>
                    <span
                      class="dt-component-bars__value"
                      [ngClass]="{ 'dt-component-bars__value--neg': row.isNegative }"
                      [style.left]="row.isNegative ? null : 'calc(' + (row.startPercent + row.lengthPercent) + '% + 6px)'"
                      [style.right]="row.isNegative ? 'calc(' + (100 - row.startPercent) + '% + 6px)' : null"
                      >{{ row.bar.savings | currency: 'USD' : 'symbol' : '1.0-0' }}</span
                    >
                  </div>
                }
              </div>
            </div>
          </div>
        }
      </div>
    }
  }
</figure>
