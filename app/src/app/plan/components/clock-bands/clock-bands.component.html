<div class="chart__header">
  <h3 class="chart__title">Three clocks, one rush hour</h3>
  <dt-simulated-badge></dt-simulated-badge>
</div>

@if (intervals.length === 0) {
  <div class="chart__empty">No intervals to plot yet.</div>
} @else {
  <div class="chart__plot">
    <svg
      class="chart__svg"
      [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight"
      role="img"
      [attr.aria-label]="ariaLabel"
      (pointermove)="onPointerMove($event)"
      (pointerleave)="onPointerLeave()"
    >
      <defs>
        <pattern
          [attr.id]="idPrefix + '-hatch'"
          width="6"
          height="6"
          patternUnits="userSpaceOnUse"
          patternTransform="rotate(45)"
        >
          <rect width="6" height="6" fill="#f1f2f4"></rect>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#c3c2b7" stroke-width="2"></line>
        </pattern>
        <pattern
          [attr.id]="idPrefix + '-bill-hatch'"
          width="6"
          height="6"
          patternUnits="userSpaceOnUse"
          patternTransform="rotate(45)"
        >
          <rect width="6" height="6" fill="#fdecec"></rect>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#d63c3c" stroke-opacity="0.3" stroke-width="2"></line>
        </pattern>
        <linearGradient [attr.id]="idPrefix + '-price-gradient'" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" [attr.stop-color]="colors.PRICE_LOW"></stop>
          <stop offset="1" [attr.stop-color]="colors.PRICE_HIGH"></stop>
        </linearGradient>
        <linearGradient [attr.id]="idPrefix + '-carbon-gradient'" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" [attr.stop-color]="colors.CARBON_LOW"></stop>
          <stop offset="1" [attr.stop-color]="colors.CARBON_HIGH"></stop>
        </linearGradient>
      </defs>

      <!-- Day boundaries -->
      @for (tick of hourTicks; track tick.x) {
        @if (tick.isMidnight) {
          <line
            class="chart__midnight-line"
            [attr.x1]="tick.x"
            [attr.x2]="tick.x"
            [attr.y1]="stripsTop"
            [attr.y2]="axisY - 12"
          ></line>
        }
      }

      <!-- Bill clock -->
      <text class="clock-bands__lane-title" [attr.x]="billLane.titleX" [attr.y]="billLane.titleY">
        {{ billLane.title }}
      </text>
      <rect
        class="clock-bands__lane-bg"
        [attr.x]="plotLeft"
        [attr.y]="billLane.stripY"
        [attr.width]="plotRight - plotLeft"
        [attr.height]="stripHeight"
      ></rect>
      @if (isAllHoursDemand) {
        <rect
          [attr.x]="plotLeft"
          [attr.y]="billLane.stripY"
          [attr.width]="plotRight - plotLeft"
          [attr.height]="stripHeight"
          [attr.fill]="billHatchFill"
        ></rect>
      }
      @for (segment of billSegments; track segment.x) {
        <rect
          class="clock-bands__on-peak"
          [attr.x]="segment.x"
          [attr.y]="segment.y"
          [attr.width]="segment.width"
          [attr.height]="segment.height"
        ></rect>
        @if (segment.label) {
          <text
            class="clock-bands__on-peak-text"
            [attr.x]="segment.x + segment.width / 2"
            [attr.y]="segment.y + 16"
            text-anchor="middle"
          >
            {{ segment.label }}
          </text>
        }
      }
      @if (isAllHoursDemand) {
        <text
          class="clock-bands__overlay-text chart__halo-text"
          [attr.x]="plotLeft + 8"
          [attr.y]="billLane.stripY + 16"
        >
          Demand counts all hours (Schedule 6)
        </text>
      }
      <text class="clock-bands__caption" [attr.x]="billLane.captionX" [attr.y]="billLane.captionY">
        {{ billLane.caption }}
      </text>

      <!-- Price and carbon clocks -->
      @for (view of heatViews; track view.lane.title; let isPrice = $first) {
        <text class="clock-bands__lane-title" [attr.x]="view.lane.titleX" [attr.y]="view.lane.titleY">
          {{ view.lane.title }}
        </text>
        @for (cell of view.cells; track cell.x) {
          <rect [attr.x]="cell.x" [attr.y]="cell.y" [attr.width]="cell.width" [attr.height]="cell.height" [attr.fill]="cell.fill"></rect>
        }
        @for (gap of view.gaps; track gap.x) {
          <rect [attr.x]="gap.x" [attr.y]="gap.y" [attr.width]="gap.width" [attr.height]="gap.height" [attr.fill]="hatchFill"></rect>
          @if (gap.label) {
            <text
              class="clock-bands__gap-text chart__halo-text"
              [attr.x]="gap.x + gap.width / 2"
              [attr.y]="gap.y + 16"
              text-anchor="middle"
            >
              {{ gap.label }}
            </text>
          }
        }
        <text class="clock-bands__caption" [attr.x]="view.lane.captionX" [attr.y]="view.lane.captionY">
          {{ view.lane.caption }}
        </text>
        @if (view.legend.visible) {
          <text class="chart__axis-text" [attr.x]="view.legend.x - 4" [attr.y]="view.legend.y + 8" text-anchor="end">
            {{ view.legend.minLabel }}
          </text>
          <rect
            class="clock-bands__legend-ramp"
            [attr.x]="view.legend.x"
            [attr.y]="view.legend.y"
            [attr.width]="legendWidth"
            height="8"
            [attr.fill]="isPrice ? priceGradientFill : carbonGradientFill"
          ></rect>
          <text class="chart__axis-text" [attr.x]="view.legend.x + legendWidth + 4" [attr.y]="view.legend.y + 8">
            {{ view.legend.maxLabel }}
          </text>
        }
      }

      @if (mefIsPlaceholder) {
        <g class="clock-bands__placeholder" [attr.transform]="'translate(' + placeholderX + ',' + placeholderY + ')'">
          <rect class="clock-bands__placeholder-pill" width="84" height="16" rx="8"></rect>
          <text class="clock-bands__placeholder-text" x="42" y="11.5" text-anchor="middle">PLACEHOLDER</text>
        </g>
      }

      <!-- Rush hour / Wattsmart window across all lanes -->
      @for (range of rushRanges; track range.x0) {
        <rect
          class="clock-bands__window"
          [attr.x]="range.x0"
          [attr.y]="stripsTop - 4"
          [attr.width]="range.x1 - range.x0"
          [attr.height]="stripsBottom - stripsTop + 8"
          rx="3"
        ></rect>
        <text class="chart__band-text" [attr.x]="range.labelX" [attr.text-anchor]="range.labelAnchor" [attr.y]="rushLabelY">{{ range.label }}</text>
      }

      <!-- Hour axis -->
      @for (tick of hourTicks; track tick.x) {
        <text class="chart__axis-text" [attr.x]="tick.x" [attr.y]="axisY" text-anchor="middle">{{ tick.label }}</text>
        @if (tick.isMidnight) {
          <text class="chart__day-text" [attr.x]="tick.x + 2" [attr.y]="axisY + 16">{{ tick.dayLabel }}</text>
        }
      }

      <!-- Hover -->
      @if (hoverX >= 0) {
        <line class="chart__crosshair" [attr.x1]="hoverX" [attr.x2]="hoverX" [attr.y1]="stripsTop - 4" [attr.y2]="stripsBottom + 4"></line>
      }
      <rect
        class="chart__hit"
        [attr.x]="plotLeft"
        [attr.y]="stripsTop - 4"
        [attr.width]="plotRight - plotLeft"
        [attr.height]="stripsBottom - stripsTop + 8"
      ></rect>
    </svg>

    @if (tooltip) {
      <div class="chart__tooltip" [class.chart__tooltip--right]="tooltip.alignRight" [style.left.%]="tooltip.leftPercent">
        <div class="chart__tooltip-title">{{ tooltip.title }}</div>
        @for (row of tooltip.rows; track row.label) {
          <div class="chart__tooltip-row">
            <span class="chart__tooltip-swatch" [style.background]="row.swatch || 'transparent'"></span>
            <span class="chart__tooltip-label">{{ row.label }}</span>
            <span class="chart__tooltip-value">{{ row.value }}</span>
          </div>
        }
      </div>
    }
  </div>
}
