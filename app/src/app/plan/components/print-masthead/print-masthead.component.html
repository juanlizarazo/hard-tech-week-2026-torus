<header class="dt-print-masthead">
  <div class="dt-print-masthead__row">
    <span class="dt-print-masthead__plate">
      <svg class="dt-print-masthead__mark" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1 12V6h7V2.5L13 7l-5 4.5V8H3.5v4z" fill="var(--dt-panel)"></path>
      </svg>
      DETOUR
    </span>
    <span class="dt-print-masthead__line dt-mono">{{ siteName }} · {{ rateLabel }} · {{ dayLabel }}</span>
  </div>
  <span class="dt-tag dt-tag--sim">Simulated site · seed {{ seed }} · real PACE data pulled {{ pulledLabel }}</span>
</header>
