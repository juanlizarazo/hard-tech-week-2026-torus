<section class="lp-text" aria-labelledby="lp-text-title">
  <div class="lp-text__toolbar">
    <div class="lp-text__titles">
      <h3 class="lp-text__title" id="lp-text-title">The LP, exactly as solved</h3>
      <p class="lp-text__meta">{{ metaLabel }}</p>
    </div>
    <button mat-stroked-button type="button" [disabled]="!lpText" (click)="onCopy($event)">
      <div class="btn-content">
        <mat-icon>{{ isCopied ? 'check' : 'content_copy' }}</mat-icon>
        <span>{{ isCopied ? 'Copied' : copyFailed ? 'Copy failed' : 'Copy LP' }}</span>
      </div>
    </button>
  </div>
  <pre class="lp-text__pre" tabindex="0" aria-label="Generated LP text">{{ lpText }}</pre>
</section>
