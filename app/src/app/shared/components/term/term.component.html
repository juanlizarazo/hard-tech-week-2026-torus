<button
  type="button"
  class="dt-term"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  #trigger
  [attr.aria-describedby]="descriptionId"
  (mouseenter)="show()"
  (mouseleave)="hideSoon()"
  (click)="openMore()"
><ng-content></ng-content></button><span class="cdk-visually-hidden" [id]="descriptionId">{{ entry.short }}</span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayFlexibleDimensions]="false"
  [cdkConnectedOverlayPush]="true"
>
  <div class="dt-term__popover" role="tooltip" [id]="popoverId" (mouseenter)="cancelHide()" (mouseleave)="hideSoon()">
    <span class="dt-term__popover-term">{{ entry.term }}</span>
    <span class="dt-term__popover-text">{{ entry.short }}</span>
    <button type="button" class="dt-term__more" tabindex="-1" (click)="openMore()">More about {{ entry.term }}</button>
  </div>
</ng-template>
